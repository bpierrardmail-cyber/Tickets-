<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13151b" />
  <title>Tickets β</title>
  <meta name="build" content="23/10 10:03" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root{
      --bg:#13151b; --bg0:#0e0f14; --card:#1b1e26; --card2:#20242e;
      --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.13);
      --ink:#eceef3; --ink-soft:#a4aab6; --muted:#7c828e;
      --accent:#4fd6a0; --accent-dim:rgba(79,214,160,.14); --coral:#f4796b;
      --mono: ui-monospace, "SFMono-Regular", "Roboto Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; }
    body{ background:var(--bg0); color:var(--ink); font-family:var(--sans);
      -webkit-font-smoothing:antialiased; padding:env(safe-area-inset-top) 0 0; }
    .app{ max-width:480px; margin:0 auto; padding:10px 14px 112px; }
    /* nombres en chasse fixe */
    .total .val, .leader .val, .entry .amt, .lgd .lv, .lgd .lp, .bar-top .bv,
    .checkrow .ctot, .prow .pfam{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
    /* En-tête */
    .head{ position:relative; text-align:center; padding:12px 0 20px; min-height:52px; box-sizing:border-box; z-index:2; }
    .hback{ position:absolute; left:0; top:14px; background:var(--card2); border:1px solid var(--line);
      color:var(--ink-soft); font-family:var(--sans); font-size:13px; padding:7px 12px; border-radius:10px; }
    .head h1{ font-size:20px; margin:0; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
    .head .sub{ font-size:10px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase; margin-top:3px; }
    .barcode{ display:none; }
    /* Menu (en haut à gauche, sur tous les onglets) */
    .hleft{ position:absolute; left:0; top:12px; display:flex; gap:8px; align-items:center; }
    .hleft .hback{ position:static; }
    .hmenu{ position:relative; width:42px; height:36px; display:grid; place-items:center; background:var(--card2); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:0; cursor:pointer; }
    .hmenu span{ display:block; width:18px; height:2px; background:currentColor; border-radius:2px; box-shadow:0 -6px 0 currentColor, 0 6px 0 currentColor; }
    .hmenu .hdot{ position:absolute; top:5px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--coral); box-shadow:0 0 0 2px var(--card2); }
    .drawer-ov{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:105; opacity:0; transition:opacity .2s; }
    .drawer-ov.open{ opacity:1; }
    .drawer{ position:absolute; left:0; top:0; bottom:0; width:min(86vw,340px); background:var(--card); border-right:1px solid var(--line2); transform:translateX(-100%); transition:transform .22s ease; overflow:auto; box-sizing:border-box; padding:calc(16px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)); }
    .drawer-ov.open .drawer{ transform:none; }
    .dr-head{ display:flex; align-items:center; justify-content:space-between; font-size:17px; margin:2px 2px 4px; }
    .dr-x{ width:36px; height:36px; border-radius:10px; background:var(--card2); border:1px solid var(--line); color:var(--ink-soft); font-size:15px; }
    .dr-sec{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:18px 2px 8px; }
    .dr-item{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:11px 12px; color:var(--ink); font-family:var(--sans); font-size:14px; font-weight:600; margin-bottom:8px; cursor:pointer; }
    .dr-item .ic{ flex:0 0 22px; text-align:center; font-size:17px; }
    .dr-item small{ display:block; font-size:11px; font-weight:500; color:var(--muted); margin-top:2px; }
    .dr-item.danger{ color:var(--coral); }
    .dr-item .chev{ margin-left:auto; color:var(--muted); font-size:20px; line-height:1; }
    .bacts{ margin-top:10px; padding:10px 10px 2px; }
    .beta-tag{ display:inline-block; font-size:11px; font-weight:700; color:#0a130f; background:var(--accent); padding:4px 9px; border-radius:999px; }
    .htitle{ height:36px; line-height:36px; font-size:18px; font-weight:700; letter-spacing:-.01em; color:var(--ink); padding:0 58px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .head.hasback .htitle{ padding:0 100px; }
    .hleft .hback{ width:42px; height:36px; padding:0; font-size:22px; line-height:1; display:grid; place-items:center; color:var(--ink); }
    .drawer{ display:flex; flex-direction:column; }
    .dr-foot{ margin-top:auto; padding-top:22px; text-align:center; font-size:11px; color:var(--muted); }
    .rule{ border:0; border-top:1px solid var(--line); margin:14px 0; }
    /* Carte principale */
    .paper{ position:relative; background:var(--card); padding:18px 16px; border-radius:20px;
      border:1px solid var(--line); box-shadow:0 12px 30px rgba(0,0,0,.35); }
    .paper.torn::after{ display:none; }
    /* Lignes à pointillés */
    .leader{ display:flex; align-items:baseline; gap:.5em; font-size:14px; padding:5px 0; }
    .leader .lbl{ white-space:nowrap; }
    .leader .fill{ flex:1; border-bottom:1px dotted var(--line2); transform:translateY(-3px); }
    .leader .val{ white-space:nowrap; font-weight:600; }
    .total{ padding:7px 0; }
    .total .lbl{ font-weight:700; letter-spacing:.02em; }
    .total .val{ font-size:24px; font-weight:700; color:var(--accent); }
    .muted{ color:var(--ink-soft); }
    .center{ text-align:center; }
    /* Tickets en cartes */
    .entry{ display:flex; flex-wrap:wrap; align-items:center; column-gap:13px; row-gap:0; background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:12px 14px; margin-bottom:10px; box-shadow:0 4px 14px rgba(0,0,0,.22); }
    .eic{ width:44px; height:44px; border-radius:13px; display:grid; place-items:center; font-size:20px; flex:0 0 auto; }
    .econ{ flex:1; min-width:0; }
    .entry .row1{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
    .entry .name{ flex:1; min-width:0; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .entry .amt{ font-weight:600; font-size:16px; white-space:nowrap; }
    .entry .row2{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-top:6px; gap:8px; }
    .entry .r2l{ display:flex; gap:6px; align-items:center; min-width:0; overflow:hidden; }
    .entry > .row1, .entry > .row2{ flex:0 0 100%; min-width:0; }
    .entry .row2 > span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    .entry .row2 > span:last-child{ flex:0 0 auto; }
    .cat{ display:inline-block; background:var(--card2); color:var(--ink-soft); padding:3px 9px; font-size:11px;
      letter-spacing:.02em; border-radius:999px; white-space:nowrap; }
    .cat.pay{ background:var(--accent-dim); color:var(--accent); }
    button{ font-family:var(--sans); cursor:pointer; }
    .fab{ position:fixed; left:50%; transform:translateX(-50%); bottom:22px;
      background:var(--accent); color:#0a130f; border:none; padding:14px 26px;
      font-size:14px; letter-spacing:.04em; font-weight:700; border-radius:16px;
      box-shadow:0 10px 26px rgba(79,214,160,.4); }
    .fab:active{ transform:translateX(-50%) translateY(1px); }
    .btn{ background:var(--card2); border:1px solid var(--line); color:var(--ink); padding:11px 15px;
      letter-spacing:.01em; font-size:13px; border-radius:12px; font-weight:500; }
    .btn.primary{ background:var(--accent); color:#0a130f; border-color:var(--accent); font-weight:700; }
    .btn.ghost{ background:var(--card2); border-color:var(--line); color:var(--ink-soft); }
    .btns{ display:flex; gap:10px; margin-top:16px; }
    /* Accueil : tableau de bord */
    .dash-hero{ position:relative; overflow:hidden; background:linear-gradient(160deg,#1f2a27 0%,var(--card) 62%); border:1px solid var(--line2); border-radius:24px; padding:18px 18px 16px; }
    .dash-date{ font-size:13px; color:var(--ink-soft); }
    .dash-date b{ color:var(--ink); font-weight:600; }
    .dash-big{ font-family:var(--sans); font-variant-numeric:tabular-nums; font-size:44px; line-height:1.05; font-weight:700; letter-spacing:-.03em; margin:14px 0 2px; }
    .dash-big .cts{ font-size:22px; opacity:.75; }
    .dash-cap{ font-size:12px; color:var(--ink-soft); }
    .dash-split{ display:flex; gap:14px; margin-top:12px; font-size:12px; color:var(--ink-soft); }
    .dash-split span b{ font-family:var(--sans); font-variant-numeric:tabular-nums; color:var(--ink); font-weight:700; margin-left:5px; }
    .dash-track{ position:relative; height:6px; border-radius:3px; background:rgba(255,255,255,.07); margin-top:16px; }
    .dash-track i{ position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--accent); }
    .dash-track em{ position:absolute; top:-3px; width:2px; height:12px; background:var(--ink); border-radius:1px; }
    .dash-trackcap{ display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:6px; }
    .dash-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .tile{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:13px 14px 12px; min-width:0; cursor:pointer; }
    .tile .t-l{ font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
    .tile .t-v{ font-family:var(--sans); font-variant-numeric:tabular-nums; font-size:19px; font-weight:700; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tile .t-d{ font-size:10px; margin-top:3px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dash-card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:15px 16px; margin-top:12px; }
    .dash-h{ display:flex; align-items:baseline; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:12px; }
    .dash-h small{ font-weight:400; font-size:11px; color:var(--muted); }
    .cbar{ cursor:pointer; padding:5px 0; }
    .cbar .cb-top{ display:flex; align-items:center; gap:8px; font-size:13px; }
    .cbar .cb-top .n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cbar .cb-top .v{ font-family:var(--sans); font-variant-numeric:tabular-nums; font-size:13px; font-weight:600; }
    .cbar .cb-top .p{ font-size:10px; color:var(--muted); width:30px; text-align:right; }
    .cbar .cb-bar{ height:5px; border-radius:3px; background:rgba(255,255,255,.05); margin-top:5px; overflow:hidden; }
    .cbar .cb-bar i{ display:block; height:100%; border-radius:3px; }
    .cbar.act .n{ color:var(--accent); font-weight:700; }
    .mchart{ display:flex; align-items:flex-end; gap:8px; height:96px; }
    .mchart .col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:pointer; }
    .mchart .col i{ display:block; width:100%; max-width:30px; border-radius:6px 6px 2px 2px; background:rgba(255,255,255,.12); min-height:3px; }
    .mchart .col.cur i{ background:var(--accent); }
    .mchart .col b{ font-family:var(--mono); font-size:9px; font-weight:400; color:var(--muted); margin-bottom:4px; white-space:nowrap; }
    .mchart .col.cur b{ color:var(--accent); }
    .mchart-x{ display:flex; gap:8px; margin-top:6px; }
    .mchart-x span{ flex:1; text-align:center; font-size:10px; color:var(--muted); text-transform:capitalize; }
    .mchart-x span.cur{ color:var(--ink); font-weight:600; }
    .paysplit{ display:flex; height:10px; border-radius:5px; overflow:hidden; gap:2px; }
    .paylgd{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:10px; font-size:12px; color:var(--ink-soft); }
    .paylgd i{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; }
    .paylgd b{ font-family:var(--sans); font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600; margin-left:4px; }
    .btns .btn{ flex:1; }
    label.f{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
      color:var(--ink-soft); margin:14px 0 6px; }
    input.f, select.f{ width:100%; font-family:var(--sans); font-size:16px; padding:12px 13px;
      border:1px solid var(--line); border-radius:12px; background:var(--card2); color:var(--ink); }
    input.f::placeholder{ color:var(--muted); }
    input.f:focus, select.f:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .chips{ display:flex; flex-wrap:wrap; gap:8px; }
    .chip{ border:1px solid var(--line); background:var(--card2); color:var(--ink); padding:8px 13px;
      font-size:13px; letter-spacing:.01em; border-radius:999px; }
    .chip.on{ background:var(--accent); color:#0a130f; border-color:var(--accent); font-weight:600; }
    .scanbox{ text-align:center; padding:22px 12px; border:1px dashed var(--line2); border-radius:16px; margin-bottom:6px; background:var(--card2); }
    .progress{ height:8px; background:var(--card2); border-radius:999px; margin-top:14px; overflow:hidden; }
    .progress > i{ display:block; height:100%; background:var(--accent); transition:width .2s; }
    .empty{ text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:14px; line-height:1.7; }
    .empty b{ color:var(--ink); }
    .offline-bar{ text-align:center; margin:20px 0 6px; font-size:12px; letter-spacing:.02em; }
    .art{ margin:10px 0; padding:12px; background:var(--card2); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:12px; }
    .art .art-name{ font-size:14px; }
    .art-row{ display:flex; gap:8px; align-items:center; margin-top:8px; }
    .art-row .art-prix{ flex:0 0 92px; }
    .art-row .combo{ flex:1; position:relative; }
    .art-row .art-prod{ width:100%; font-size:13px; }
    .combo-pop{ position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:40; background:var(--card2); border:1px solid var(--line); border-radius:10px; max-height:210px; overflow:auto; display:none; box-shadow:0 10px 26px rgba(0,0,0,.45); }
    .combo-pop.open{ display:block; }
    .combo-opt{ padding:10px 12px; font-size:13px; color:var(--ink); border-bottom:1px solid var(--line); cursor:pointer; }
    .combo-opt:last-child{ border-bottom:0; }
    .combo-opt.new{ color:var(--accent); font-weight:600; }
    .art-row .art-del{ flex:0 0 auto; padding:10px 13px; }
    .art-com{ display:flex; align-items:center; gap:8px; margin-top:9px; font-size:13px; color:var(--ink-soft); }
    .art-com input{ width:19px; height:19px; accent-color:var(--accent); flex:0 0 auto; }
    .leader.fam{ margin-top:10px; }
    .leader.fam .lbl{ font-weight:700; letter-spacing:.01em; }
    .leader.fam .val{ font-weight:700; color:var(--accent); }
    .leader.item{ font-size:13px; padding-left:14px; }
    .leader.item .lbl, .leader.item .val{ color:var(--ink-soft); }
    .prow{ display:flex; gap:8px; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line); }
    .prow .pname{ flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .prow .pfam{ flex:0 0 148px; font-size:13px; }
    .prow .pdel, .prow .pren, .prow .pdelfam, .prow .catren, .prow .catdel, .prow .fxedit, .prow .fxdel, .prow .fxdone{ flex:0 0 auto; padding:8px 11px; }
    .pname.pedit{ text-decoration:underline dotted; text-underline-offset:3px; }
    .bar-row{ margin:14px 2px; }
    .bar-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:6px; }
    .bar-top .bl{ letter-spacing:.01em; }
    .bar-top .bv{ font-weight:700; }
    .bar-track{ height:14px; background:var(--card2); border-radius:999px; overflow:hidden; }
    .bar-track > i{ display:block; height:100%; background:var(--accent); border-radius:999px; }
    .bar-row.clk{ cursor:pointer; }
    .leader.item.itemclk{ cursor:pointer; }
    .leader.item.itemclk .lbl{ text-decoration:underline dotted; text-underline-offset:3px; }
    .checkrow{ display:flex; align-items:center; gap:11px; padding:11px 2px; font-size:14px; border-bottom:1px solid var(--line); }
    .checkrow input{ width:19px; height:19px; accent-color:var(--accent); flex:0 0 auto; }
    .checkrow .ctot{ margin-left:auto; font-weight:700; color:var(--ink-soft); }
    .graph-block{ margin-top:18px; }
    .graph-block .gtitle{ font-weight:700; letter-spacing:.02em; font-size:13px; color:var(--accent); margin:6px 0 8px; }
    .seg{ display:flex; background:var(--card2); border-radius:13px; padding:4px; margin:14px 0 6px; gap:4px; }
    .seg button{ flex:1; background:none; border:none; padding:9px 4px; font-family:var(--sans); font-size:13px;
      letter-spacing:.01em; color:var(--ink-soft); border-radius:9px; font-weight:600; }
    .seg button.on{ background:var(--accent); color:#0a130f; }
    .lgd{ display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; padding:11px 2px;
      border-bottom:1px solid var(--line); font-family:var(--sans); font-size:14px; color:var(--ink); text-align:left; }
    .lgd .sw{ width:12px; height:12px; flex:0 0 auto; border-radius:3px; }
    .lgd .ln{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lgd .lv{ color:var(--ink-soft); font-weight:600; }
    .lgd .lp{ flex:0 0 44px; text-align:right; color:var(--muted); font-weight:600; }
    .lgd.off{ opacity:.4; }
    .lgd.off .ln{ text-decoration:line-through; }
    /* Barre du bas */
    .nav{ position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; flex-direction:column;
      background:#15241f;
      border-top:1px solid rgba(79,214,160,.22); padding:0 6px calc(8px + env(safe-area-inset-bottom)); }
    .nav.hidden{ display:none; }
    .navscanrow{ display:flex; justify-content:center; }
    .navscanrow button{ background:var(--accent); color:#0a130f; border:4px solid var(--bg0); width:60px; height:60px;
      border-radius:50%; margin-top:-26px; box-shadow:0 10px 24px rgba(79,214,160,.45); font-family:var(--sans);
      font-size:11px; letter-spacing:.04em; font-weight:700; }
    .navscanrow button:active{ transform:translateY(1px); }
    .nav.noscan .navscanrow{ display:none; }   /* bouton Scan affiché seulement sur l'Accueil */
    .nav.noscan .navtabs{ padding-top:8px; }
    .navtabs{ display:flex; padding-top:4px; }
    .navtabs .navi{ flex:1; background:none; border:none; color:var(--muted); font-family:var(--sans);
      font-size:10px; letter-spacing:.01em; font-weight:600; padding:4px 0 6px; position:relative; }
    .navtabs .navi.on{ color:var(--accent); }
    .navtabs .navi.on::before{ content:""; position:absolute; top:-2px; left:30%; right:30%; height:3px; background:var(--accent); border-radius:999px; }
    .lightbox{ position:fixed; inset:0; background:#000; z-index:100; display:flex; flex-direction:column; }
    .lbtop{ display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; color:#fff; }
    .lbtop .lbx{ background:rgba(255,255,255,.14); border:none; color:#fff; width:40px; height:40px; border-radius:50%; font-size:22px; line-height:1; flex:0 0 auto; }
    .lbtop .lbcap{ min-width:0; }
    .lbtop .lbn{ font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lbtop .lbm{ font-size:12px; color:#aab; }
    .lbimg{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:4px 10px; }
    .lbimg img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
    .lbbtns{ display:flex; gap:10px; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); }
    .lbbtns .btn{ flex:1; }
    .gallery{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:6px; }
    .gtile{ position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:var(--card2); }
    .gimg{ width:100%; padding-top:125%; background-size:cover; background-position:center; cursor:pointer; }
    .gdel{ position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:none; font-size:13px; line-height:1; }
    .gcap{ position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; gap:8px; align-items:flex-end; padding:16px 9px 7px; font-size:11px; background:linear-gradient(transparent, rgba(0,0,0,.8)); color:#fff; }

      else h+=it("foyer","👨‍👩‍👧","Foyer de "+(fyCfg.owner||"…"),esc(fyRoleLabel(fyCfg.role)+" · "+fySyncLabel()));
      if(!fyM) h+='<div class="dr-sec">Sauvegarde</div>'+it("backup","💾","Sauvegarder",'<span style="color:'+bc+'">'+esc(bt)+'</span>')+it("restore","📂","Restaurer une sauvegarde",esc("Remplace les données par celles du fichier"));
      h+='<div class="dr-sec">Sécurité</div>';

    function personCounts(n){

    function norm(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim(); }

    function lev(a,b){
      var m=a.length, n=b.length; if(!m) return n; if(!n) return m;
      var prev=[], cur=[], i, j;
      for(j=0;j<=n;j++) prev[j]=j;
      for(i=1;i<=m;i++){
        cur[0]=i;
        for(j=1;j<=n;j++){ var cost=a.charAt(i-1)===b.charAt(j-1)?0:1; cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost); }
        for(j=0;j<=n;j++) prev[j]=cur[j];

      return prev[n];
    }
    function simRatio(a,b){
      if(!a||!b) return 0;
      var lr=1 - lev(a,b)/Math.max(a.length,b.length);
      var wa=a.split(" "), wb=b.split(" "), setb={}, uni={}, inter=0, seen={}, k;
      for(k=0;k<wb.length;k++){ setb[wb[k]]=1; uni[wb[k]]=1; }
      for(k=0;k<wa.length;k++){ uni[wa[k]]=1; if(setb[wa[k]] && !seen[wa[k]]){ inter++; seen[wa[k]]=1; } }
      var tot=0; for(var u in uni) tot++;
      var wr=tot? inter/tot : 0;
      return Math.max(lr, wr);
    }

    // Enseigne : on cherche dans le haut du ticket un magasin déjà connu (tes tickets d'abord,
    // puis les grandes enseignes), en tolérant les erreurs de lecture (« IntermaRche » → Intermarché).
    var CHAINS=["Intermarché","E.Leclerc","Carrefour","Carrefour Market","Carrefour City","Carrefour Contact","Auchan","Lidl","Aldi","Super U","Hyper U","U Express","Casino","Géant Casino","Monoprix","Franprix","Netto","Biocoop","Grand Frais","Picard","Cora","Match","Colruyt","Action","Gifi","La Foir'Fouille","Leroy Merlin","Castorama","Brico Dépôt","Bricomarché","Weldom","Mr.Bricolage","Gamm Vert","Jardiland","Truffaut","Norauto","Feu Vert","Decathlon","Intersport","Boulanger","Darty","Fnac","Ikea","Maisons du Monde","Kiabi","Jules","Zara","H&M","Primark","Sephora","Nocibé","Marionnaud","TotalEnergies","Esso","Avia","Shell","McDonald's","Burger King","KFC","Quick","Subway","Starbucks","Paul","Marie Blachère","La Poste"];
    function matchMerchant(lines, guess){
      var cands={};
      try{ (state.entries||[]).forEach(function(e){ var m=(e.marchand||"").trim(); if(m) cands[m]=(cands[m]||0)+1; }); }catch(e){}
      CHAINS.forEach(function(c){ if(!(c in cands)) cands[c]=0; });
      var top=(lines||[]).slice(0,8).map(function(l){ return norm(String(l).replace(/1/g,"i").replace(/0/g,"o").replace(/5/g,"s")); }).filter(function(l){ return l.replace(/ /g,"").length>=3; });
      // morceaux du haut du ticket : la ligne entière et chaque suite de 1 à 3 mots
      var parts=[];
      top.forEach(function(l){ var w=l.split(" "); parts.push(l.replace(/ /g,""));
        for(var a=0;a<w.length;a++) for(var b=a+1;b<=Math.min(w.length,a+3);b++) parts.push(w.slice(a,b).join("")); });
      var best=null, bs=0, bl=0;
      Object.keys(cands).forEach(function(c){
        var nc=norm(c).replace(/ /g,""); if(nc.length<3) return;
        parts.forEach(function(pc){
          if(pc.length<3) return;
          var sc=1-lev(pc, nc)/Math.max(pc.length, nc.length);

          if(cands[c]>0) sc+=0.03;                  // ta propre orthographe d'abord
          if(sc>bs || (sc===bs && nc.length>bl)){ bs=sc; best=c; bl=nc.length; }

      return (guess||"").replace(/[A-Za-zÀ-ÿ]+/g, function(w){ return (/[a-zà-ÿ]/.test(w) && /[A-ZÀ-Ý]/.test(w.slice(1))) ? w.charAt(0).toUpperCase()+w.slice(1).toLowerCase() : w; });

    function parseTicket(text){
      var lines = text.split(/\n/).map(function(l){return l.trim();}).filter(Boolean);
      var amtRe = /(\d{1,4})[.,](\d{2})\b/g;
      // Lignes de paiement / totaux (tolère les erreurs de lecture : T0TAL, YONTANT…)
      var key = /t[o0]ta[l1i]|[mnyw]{1,2}ontant|ontant\s*d|a payer|à payer|net a|net à|carte|\bcb\b|visa|mastercard|sans contact|esp[eè]ces|rendu|rendre|monnaie|tva|\bttc\b|\bht\b/i;
      var totRe = /t[o0]ta[l1i]|[mnyw]{1,2}ontant|ontant\s*d|a payer|à payer|net a|net à/i;
      // En-tête du magasin : téléphone, RCS, SIRET… (jamais des articles ni des montants)
      var skip = /\b(t[eé]l|tel|fax|siret|siren|rcs|naf|ape|www|http|caisse|ticket|op[eé]rateur|h[oô]tesse|vendeur)\b|@/i;
      var all = [], lignes = [], afterTotal = false;
      function cleanLabel(l){
        var t=l.replace(/(\d{1,4})[.,](\d{2})\b/g," ").replace(/\b(eur|euros?)\b(\s+[a-d]\b)?/gi," ").replace(/€/g," ");
        var up=(t.match(/[A-ZÀ-Ý]/g)||[]).length, lo=(t.match(/[a-zà-ÿ]/g)||[]).length;
        // ticket en majuscules : un mot avec des minuscules est du bruit (filigrane lu à l'envers…)
        if(up>=4 && up>=lo*3) t=t.split(/\s+/).filter(function(w){ return !/[a-zà-ÿ]/.test(w); }).join(" ");
        t=t.replace(/\b0(?=[A-ZÀ-Ý]{2})/g,"O").replace(/([A-ZÀ-Ý])0(?=[A-ZÀ-Ý])/g,"$1O");
        return t.replace(/[^0-9A-Za-zÀ-ÿ ]+/g," ").replace(/\s+/g," ").trim().replace(/\s[A-D]$/,"");
      }
      lines.forEach(function(l){
        var m, last=null, isSkip=skip.test(l) || /\b\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\b/.test(l); amtRe.lastIndex=0;
        while((m=amtRe.exec(l))){ if(!isSkip) all.push({ value: parseFloat(m[1]+"."+m[2]), line:l }); last=m; }
        var isKey=key.test(l);
        if(isKey && last && totRe.test(l)) afterTotal=true;   // après le total : paiement, TVA, pied de ticket
        if(afterTotal || isSkip || isKey || !last) return;
        var prix = parseFloat(last[1]+"."+last[2]);
        if(!(prix>0)) return;
        var label = cleanLabel(l);
        if(label.replace(/[^A-Za-zÀ-ÿ]/g,"").length < 2) return;
        lignes.push({ label: label.slice(0,28), prix: String(prix).replace(".",","), produit:"" });
      });
      var flagged = all.filter(function(a){ return totRe.test(a.line); });
      var total = "";
      if(flagged.length) total = Math.max.apply(null, flagged.map(function(a){return a.value;}));
      else if(all.length) total = Math.max.apply(null, all.map(function(a){return a.value;}));
      // Date : la première date valide (jour/mois cohérents, pas dans le futur), de préférence avec l'année sur 4 chiffres

      var date="", best=null, dm, today=todayISO();

        if(iso>today || iso<oldest) continue;

      return { total: total, date: date, marchand: marchand, categorie: guessCat(text), lignes: lignes };
    }

    function fitHero(){
      var hero=document.querySelector(".thero"); if(!fitView() || !hero){ CHB=0; app.style.paddingBottom=""; return; }
      var nav=document.getElementById("nav"), navH=(nav && nav.offsetHeight)||0;
      // la carte + les lignes du dessous (Frais fixes, Par famille, Mes comptes…) tiennent ensemble dans l'écran

      app.style.paddingBottom=(navH+12)+"px";
      var hr=hero.getBoundingClientRect(), last=app.lastElementChild, after=last ? Math.max(0, last.getBoundingClientRect().bottom-hr.bottom) : 0;
      var top=hr.top+(window.scrollY||0), target=Math.floor(window.innerHeight-navH-top-after-12);
      if(target<200) target=200;
      // mesure faite avec la mise en page finale (colonne flexible : les marges ne se chevauchent plus), sinon il manque quelques pixels
      hero.classList.add("fit"); hero.style.setProperty("--chb", CHB+"px");
      var diff=target-hero.offsetHeight, nb=Math.max(-70, Math.min(420, CHB+diff));
      if(fitting<5 && Math.abs(nb-CHB)>1){ fitting++; CHB=nb; fitMemo[v0key()]=nb; try{ render(); }finally{ fitting--; } return; }
      hero=document.querySelector(".thero"); if(hero){ hero.classList.add("fit"); hero.style.setProperty("--chb", CHB+"px"); hero.style.height=target+"px";

    function fitDonut(c){
      function ov(){ return c.scrollHeight-c.clientHeight; }
      var cd=c.querySelector(".cdon-big"); if(!cd || ov()<=3) return;
      cd.classList.add("tight"); if(ov()<=3) return;

      function size(n){ sv.style.flexBasis=n+"px"; sv.style.width=n+"px"; sv.style.height=n+"px"; }
      var sH=sv.getBoundingClientRect().height;
      size(Math.max(100, sH-ov())); if(ov()<=3 || !lg) return;   // 1) anneau un peu plus petit
      // 2) les plus petites lignes de la légende regroupées en « + N autres »
      var rows=[].slice.call(lg.querySelectorAll(".cdon-r")), hid=0, more=document.createElement("div");
      more.className="cdon-r cdon-more"; more.style.color="var(--muted)"; lg.appendChild(more);

      if(!hid) lg.removeChild(more);

      if(ov()>3) size(Math.max(64, sv.getBoundingClientRect().height-ov()));
    }

    var ARTPAL=["#7c9cf4","#e0a458","#4fd6a0","#c78bd6","#5bc0d4","#e88fb0","#9bd35e","#d4a05b","#8a92e0","#6fcaa8","#d98c5f","#b0b6c2","#f4796b"];
    // Historique des articles (12 derniers mois jusqu'au mois affiché) : prix d'une ligne, magasins, évolution, économies possibles
    function artHistory(month){
      var mk=month, ms={}; for(var i=0;i<12;i++){ ms[mk]=1; mk=prevMonthKey(mk); }
      var pOn=artProdOn(), by={}, sm={};
      function sk(x){ x=String(x||"").toLowerCase(); try{ x=x.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }catch(e){} return x.replace(/[^a-z ]+/g," ").replace(/\b(sas|sarl|sa|magasin|store|super|hyper|market)\b/g," ").replace(/\s+/g," ").trim(); }
      // magasins presque identiques regroupés : même premier mot à une lettre près (« INTERMACHE » = « Intermarché La Rotonde »)
      function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; var d=[], i, j; for(i=0;i<=a.length;i++) d[i]=[i]; for(j=1;j<=b.length;j++) d[0][j]=j;
        for(i=1;i<=a.length;i++) for(j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1)); return d[a.length][b.length]; }
      var cnt={}; vEntries().forEach(function(e){ if(!ms[monthKey(e.date)]) return; var k=sk(e.marchand); if(k) cnt[k]=(cnt[k]||0)+1; });
      var heads=[], ali={}; Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]; }).forEach(function(k){ var f=k.split(" ")[0], hit=null;
        for(var q=0;q<heads.length;q++){ var g=heads[q].split(" ")[0], m0=Math.min(f.length,g.length); if((m0>=5 && lev(f,g)<=(m0>=9?2:1)) || k===heads[q]){ hit=heads[q]; break; } }
        if(hit) ali[k]=hit; else heads.push(k); });
      vEntries().forEach(function(e){ var m=monthKey(e.date); if(!ms[m]) return; var st=(e.marchand||"").trim(), k=sk(st); k=ali[k]||k;
        (e.articles||[]).forEach(function(a){ if(a.commun && !pOn) return; var c=classifyArticle(a); if(c.fam==="Remise" || !(c.amt>0)) return;
          if(m===month){ var S0=sm[k||"?"]||(sm[k||"?"]={ name:st||"?", names:{}, sum:0, nA:0, t:{} }); S0.sum+=c.amt; S0.nA++; S0.t[e.id]=1; S0.names[st||"?"]=(S0.names[st||"?"]||0)+1; }
          var key=c.fam+"|"+c.name; if(!by[key]) by[key]={ fam:c.fam, name:c.name, lines:[] };
          by[key].lines.push({ d:e.date||"", m:m, p:c.amt, sk:k, st:st }); }); });
      var list=[], saveMonth=0, saveYear=0;
      Object.keys(by).forEach(function(key){ var P=by[key], L=P.lines.sort(function(a,b){ return a.d<b.d?-1:(a.d>b.d?1:0); });
        var stores={}; L.forEach(function(l){ if(!l.sk) return; var o=stores[l.sk]||(stores[l.sk]={ name:l.st, sum:0, n:0, names:{} }); o.sum+=l.p; o.n++; o.names[l.st]=(o.names[l.st]||0)+1; });
        var sl=Object.keys(stores).map(function(k){ var o=stores[k]; o.avg=o.sum/o.n; o.name=Object.keys(o.names).sort(function(a,b){ return o.names[b]-o.names[a]; })[0]; return o; }).sort(function(a,b){ return a.avg-b.avg; });
        var inM=L.filter(function(l){ return l.m===month; }), last=L[L.length-1], first=L[0];
        // évolution : dans le magasin du dernier achat si on y a acheté avant (sinon tous magasins confondus)
        var same=L.filter(function(l){ return l.sk===last.sk; }), f0=(same.length>1 ? same[0] : first);
        // comparaison utile seulement si l'écart entre magasins dépasse 2 % (sinon c'est l'évolution du prix, pas le magasin)
        // comparable si l'écart est réel (≥ 2 %) mais pas énorme (≤ 50 %) : au-delà, ce n'est pas le même produit ou pas la même quantité (gasoil, matériaux…)
        var lo0=sl.length?sl[0].avg:0, hi0=sl.length?sl[sl.length-1].avg:0;
        var cheap=(sl.length>=2 && hi0-lo0>=Math.max(0.01, lo0*0.02) && hi0<=lo0*1.5) ? lo0 : null; if(cheap==null) sl=[];
        if(cheap!=null) L.forEach(function(l){ var d=l.p-cheap; if(d>0.004){ saveYear+=d; if(l.m===month) saveMonth+=d; } });
        list.push({ fam:P.fam, name:P.name, nBuy:L.length, nMonth:inM.length, totMonth:inM.reduce(function(t,l){ return t+l.p; },0),
          firstPrice:f0.p, lastPrice:(inM.length?inM[inM.length-1].p:last.p), lastStore:(inM.length?inM[inM.length-1].st:last.st), evo:(L.length>1 && f0!==last && f0.p>0 ? (last.p-f0.p)/f0.p*100 : 0), stores:sl });
      });
      Object.keys(sm).forEach(function(k){ var o=sm[k]; o.nT=Object.keys(o.t).length; o.name=Object.keys(o.names).sort(function(a,b){ return o.names[b]-o.names[a]; })[0]; });
      return { list:list, saveMonth:saveMonth, saveYear:saveYear, storesMonth:sm };
    }

    function artMonthData(m){

        (e.articles||[]).forEach(function(a){

    // Réglage des parts du commun (en %) : − / + par 5 %, saisie directe, « Parts égales » ; le total doit faire 100 %

      var h='<div class="sheet-title">Parts du commun</div><div class="ui-intro">Part de chacun dans les frais communs et les produits partagés. À 0 %, la personne ne paie que ses frais perso.</div>'+

        '<div class="ui-err" style="display:none"></div><div class="ui-actions"><button type="button" class="btn ghost ui-cancel">Annuler</button><button type="button" class="btn primary cp-ok">Valider</button></div>';
      var s=uiSheet(h);
      function total(){ var t=0; cands.forEach(function(p){ t+=draft[p]||0; }); return num2(t); }
      function paint(keepInp){
        var t=total(), ok=Math.abs(t-100)<0.05, tt=s.q(".cp-tot");
        tt.textContent= ok ? "Total 100 % ✓" : "Total "+pctTxt(t)+" · "+(t<100?"il manque "+pctTxt(100-t):pctTxt(t-100)+" en trop");

    // Commun d'un mois : frais, produits partagés, personnes et parts (utilisé par l'onglet Commun et les widgets)
    function communModel(month){
      function monthData(m){
        var frais=fraisCommuns.filter(function(f){ return fraisActif(f, m); }), byP={}, fraisTot=0;
        frais.forEach(function(f){ var who=(f.personne||"").trim()||"Commun"; if(!byP[who]) byP[who]={ total:0, items:[] }; var v=fraisMontant(f, m); byP[who].total+=v; byP[who].items.push(f); fraisTot+=v; });
        var rows=[], prod=0;
        state.entries.filter(function(e){ return monthKey(e.date)===m; }).forEach(function(e){
          (e.articles||[]).forEach(function(a){ if(!a.commun) return; var amt=Number(a.prix)||0;
            rows.push({ id:e.id, marchand:e.marchand, date:e.date, label:(a.label||"").trim()||a.produit||"Article", prix:amt }); prod+=amt; });
        });
        rows.sort(function(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); });
        return { frais:frais, byP:byP, fraisTot:fraisTot, rows:rows, prod:prod, commun:(byP.Commun?byP.Commun.total:0) };
      }
      var D=monthData(month);
      var totPersons=[];
      fraisCommuns.forEach(function(f){ var fp=(f.personne||"").trim(); if(fp && fp!=="Commun" && totPersons.indexOf(fp)<0) totPersons.push(fp); });
      state.entries.forEach(function(e){ var pp=(e.payePar||"").trim(); if(pp && pp!=="Commun" && totPersons.indexOf(pp)<0) totPersons.push(pp); });
      totPersons=totPersons.filter(function(p){ var r=personRec(p); return !(r && r.archived) || month<r.archived || (D.byP[p] && D.byP[p].items.length); });
      totPersons.sort();
      var me=mePerson(); if(totPersons.indexOf(me)<0) totPersons.unshift(me);
      var ppl=[me].concat(totPersons.filter(function(p){ return p!==me; }));
      function persoOf(who){ return D.byP[who]?D.byP[who].total:0; }
      // Parts du commun : celles réglées (en %), sinon parts égales entre les personnes du commun
      var CP=(communParts && typeof communParts==="object") ? communParts : null;
      if(CP) Object.keys(CP).forEach(function(n){ if((Number(CP[n])||0)>0 && ppl.indexOf(n)<0) ppl.push(n); });
      (D.byP.Commun?D.byP.Commun.items:[]).forEach(function(f){ var P=fraisPartsAt(f, month); if(P) Object.keys(P).forEach(function(n){ if((Number(P[n])||0)>0 && ppl.indexOf(n)<0) ppl.push(n); }); });
      var cpSum=0; if(CP) Object.keys(CP).forEach(function(n){ cpSum+=Math.max(0, Number(CP[n])||0); });
      if(CP && cpSum<=0) CP=null;
      // ramené à 100 % pile (3 × 33,33 % = 99,99 %) pour que les parts fassent exactement le total
      function pctOf(who){ if(CP) return Math.max(0, Number(CP[who])||0)/cpSum*100; return ppl.indexOf(who)>=0 ? 100/ppl.length : 0; }
      function fPct(f, who){ var P=fraisPartsAt(f, month); return P ? partsPct(P, who) : pctOf(who); }
      // Part des frais communs : frais par frais (chacun peut avoir ses parts)
      function communShareOf(who){ var t=0; (D.byP.Commun?D.byP.Commun.items:[]).forEach(function(f){ t+=fraisMontant(f, month)*fPct(f, who)/100; }); return t; }
      function shareOf(who){ return communShareOf(who)+D.prod*pctOf(who)/100; }
      function partOf(who){ return persoOf(who)+shareOf(who); }
      // Part réelle sur tout le commun (frais + produits), en %
      function effPct(who){ var pot=D.commun+D.prod; return pot>0 ? shareOf(who)/pot*100 : pctOf(who); }
      return { monthData:monthData, D:D, me:me, ppl:ppl, CP:CP, persoOf:persoOf, pctOf:pctOf, fPct:fPct, communShareOf:communShareOf, effPct:effPct, shareOf:shareOf, partOf:partOf };
    }
    function renderCommunes(){

      hero.addEventListener("pointerdown", function(ev){ moved=false; if(swipeSkip(ev.target, hero)) return; x0=ev.clientX; y0=ev.clientY; dx=0; lock=null; });

    function wireHeroSwipe(cur, keys, setKey){

      var i=keys.indexOf(cur), x0=null, y0=0, dx=0, lock=null, moved=false;

      hero.addEventListener("pointermove", function(ev){ if(x0===null) return; dx=ev.clientX-x0; var dy=ev.clientY-y0;
        if(lock===null && (Math.abs(dx)>8 || Math.abs(dy)>8)) lock=(Math.abs(dx)>Math.abs(dy))?"x":"y"; if(lock!=="x") return;

      function up(){ if(x0===null) return; x0=null; if(lock==="x" && Math.abs(dx)>10) moved=true;

    function makeCanvas(srcImg, w0, h0){
      var longest=Math.max(w0,h0), scale=1;
      if(w0<1600) scale=1600/w0;
      if(longest*scale>2000) scale=2000/longest;
      var w=Math.max(1,Math.round(w0*scale)), h=Math.max(1,Math.round(h0*scale));
      var c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(srcImg,0,0,w,h);
      return c;
    }
    function enhance(c){
      try{
        var ctx=c.getContext("2d"), d=ctx.getImageData(0,0,c.width,c.height), p=d.data, i, g, min=255, max=0;
        var lum=new Uint8ClampedArray(c.width*c.height);
        for(i=0;i<p.length;i+=4){ g=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114)|0; lum[i>>2]=g; if(g<min)min=g; if(g>max)max=g; }
        var range=(max-min)||1;
        for(i=0;i<p.length;i+=4){ var v=(lum[i>>2]-min)*255/range; v=(v-128)*1.4+128; if(v<0)v=0; else if(v>255)v=255; p[i]=p[i+1]=p[i+2]=v; }
        ctx.putImageData(d,0,0);
      }catch(e){}
      return c;
    }
    function preprocess(file){
      return new Promise(function(resolve){
        function viaImg(){
          try{
            var img=new Image();
            img.onload=function(){ try{ resolve(enhance(makeCanvas(img,img.width,img.height))); }catch(e){ resolve(file); } };
            img.onerror=function(){ resolve(file); };
            img.src=URL.createObjectURL(file);
          }catch(e){ resolve(file); }
        }
        try{
          if(self.createImageBitmap){
            createImageBitmap(file).then(function(bmp){
              try{ var c=makeCanvas(bmp,bmp.width,bmp.height); try{ bmp.close(); }catch(e){} resolve(enhance(c)); }
              catch(e){ viaImg(); }
            }).catch(viaImg);
          } else viaImg();
        }catch(e){ viaImg(); }
      });
    }

    function canvasToBlob(src){
      return new Promise(function(resolve){
        function compress(canvas){
          var quals=[0.7,0.55,0.42,0.32,0.25], steps=0;
          (function attempt(qi){
            steps++;
            if(qi>=quals.length){
              if(canvas.width<=900 || steps>16){ canvas.toBlob(function(b){ resolve(b||src); }, "image/jpeg", 0.4); return; }
              var nc=document.createElement("canvas");
              nc.width=Math.max(1,Math.round(canvas.width*0.8));
              nc.height=Math.max(1,Math.round(canvas.height*0.8));
              nc.getContext("2d").drawImage(canvas,0,0,nc.width,nc.height);
              canvas=nc; attempt(0); return;
            }
            canvas.toBlob(function(b){
              if(!b){ resolve(src); return; }
              if(b.size<=950000){ resolve(b); return; }
              attempt(qi+1);
            }, "image/jpeg", quals[qi]);
          })(0);
        }
        if(src && src.toBlob){ compress(src); return; }
        function smallFrom(srcImg, w0, h0){ var lo=Math.max(w0,h0), s=lo>2000?2000/lo:1; var c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w0*s)); c.height=Math.max(1,Math.round(h0*s)); c.getContext("2d").drawImage(srcImg,0,0,c.width,c.height); return c; }
        function viaImg(){ try{ var img=new Image(); img.onload=function(){ try{ compress(smallFrom(img,img.width,img.height)); }catch(e){ resolve(src); } }; img.onerror=function(){ resolve(src); }; img.src=URL.createObjectURL(src); }catch(e){ resolve(src); } }
        try{
          if(self.createImageBitmap){ createImageBitmap(src).then(function(bmp){ try{ var c=smallFrom(bmp,bmp.width,bmp.height); try{ bmp.close(); }catch(e){} compress(c); }catch(e){ viaImg(); } }).catch(viaImg); }
          else viaImg();
        }catch(e){ viaImg(); }
      });
    }

    function capNative(){ try{ var C=window.Capacitor; return !!(C && C.isNativePlatform && C.isNativePlatform()); }catch(e){ return false; } }
    var capPlugs={};
    function capPlugin(name){

    // Photo d'origine (en couleurs, ML Kit lit mieux sans retouche), réduite à 2200 px, en JPEG base64
    function nativeImage(file){
      return new Promise(function(resolve, reject){
        function draw(src, w, h){ var lo=Math.max(w,h), k=lo>2200?2200/lo:1, c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
          c.getContext("2d").drawImage(src,0,0,c.width,c.height); var u=c.toDataURL("image/jpeg",0.9); resolve(u.slice(u.indexOf(",")+1)); }
        function viaImg(){ var img=new Image(); img.onload=function(){ try{ draw(img, img.naturalWidth||img.width, img.naturalHeight||img.height); }catch(e){ reject(e); } }; img.onerror=function(){ reject(new Error("image illisible")); }; img.src=URL.createObjectURL(file); }
        try{ if(self.createImageBitmap) createImageBitmap(file).then(function(b){ try{ draw(b,b.width,b.height); try{ b.close(); }catch(e){} }catch(e){ viaImg(); } }).catch(viaImg); else viaImg(); }
        catch(e){ viaImg(); }

    // ML Kit rend des morceaux de texte (souvent le libellé et le prix séparément) :
    // on redresse la photo d'après l'inclinaison moyenne, puis on regroupe les morceaux
    // qui sont à la même hauteur pour retrouver les lignes du ticket, de gauche à droite.
    function mlkitRows(res){
      var L=[];
      (res && res.lines || []).forEach(function(l){ if(!l || !l.t) return; var q=l.p; if(!q || q.length<8) return; L.push({ t:String(l.t), q:q }); });
      if(!L.length) return (res && res.text) || "";
      var ang=L.map(function(l){ return Math.atan2(l.q[3]-l.q[1], l.q[2]-l.q[0]); }).sort(function(a,b){ return a-b; });
      var a=ang[Math.floor(ang.length/2)]||0; if(Math.abs(a)>0.6) a=0;
      var ca=Math.cos(-a), sa=Math.sin(-a);
      L.forEach(function(l){ var xs=[], ys=[]; for(var i=0;i<8;i+=2){ xs.push(l.q[i]*ca-l.q[i+1]*sa); ys.push(l.q[i]*sa+l.q[i+1]*ca); }
        l.x=Math.min.apply(null,xs); var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys); l.h=Math.max(1,y1-y0); l.cy=(y0+y1)/2; });
      var hs=L.map(function(l){ return l.h; }).sort(function(a,b){ return a-b; }), mh=hs[Math.floor(hs.length/2)]||10;
      L.sort(function(a,b){ return a.cy-b.cy; });
      var rows=[];
      L.forEach(function(l){ var r=rows[rows.length-1];
        if(r && Math.abs(l.cy-r.cy)<mh*0.6){ r.it.push(l); r.cy=(r.cy*(r.it.length-1)+l.cy)/r.it.length; }
        else rows.push({ cy:l.cy, it:[l] }); });
      return rows.map(function(r){ return r.it.sort(function(a,b){ return a.x-b.x; }).map(function(i){ return i.t; }).join("  "); }).join("\n");
    }

    function ocrCloud(blob){
      var key=store.read("ocrKey","");
      if(!key) return Promise.reject(new Error("pas de cle"));
      var fd=new FormData();
      fd.append("apikey", key); fd.append("language","fre"); fd.append("OCREngine","2");
      fd.append("isTable","true"); fd.append("scale","true");
      fd.append("file", blob, "ticket.jpg");
      return fetch("https://api.ocr.space/parse/image",{ method:"POST", body:fd })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(j.IsErroredOnProcessing) throw new Error((j.ErrorMessage&&j.ErrorMessage[0])||"erreur OCR cloud");
          return (j.ParsedResults&&j.ParsedResults[0]&&j.ParsedResults[0].ParsedText)||"";
        });
    }

    filein.onchange=function(ev){
      var files=ev.target.files ? [].slice.call(ev.target.files) : []; ev.target.value="";
      if(!files.length) return;
      state.busy=true; state.prog=0; state.note="";
      state.scanMsg = files.length>1 ? ("Lecture 1/"+files.length+"…") : (capPlugin("TicketOcr") ? "Lecture du ticket sur le téléphone…" : "Lecture du ticket en cours…");
      state.draftRO=false; state.draft={id:null,montant:"",date:todayISO(),marchand:"",categorie:"Autre",articles:[],payePar:fyDefPayer(),photo:""};
      state.view="form"; render();
      if(files[0]) fileToThumb(files[0], function(t){ if(t && state.draft && state.view==="form"){ state.draft.photo=t; render(); } });
      function tessText(src){ return Tesseract.recognize(src, "fra+eng", { logger:function(m){
          if(m.status==="recognizing text"){ state.prog=Math.round(m.progress*100); var bar=document.getElementById("bar"); if(bar) bar.style.width=state.prog+"%"; }
        }}).then(function(r){ return (r.data&&r.data.text)||""; }); }
      var diag=[];
      function localOne(src){ return (typeof Tesseract==="undefined") ? Promise.resolve("") : tessText(src).then(function(t){ diag.push("local:"+(t||"").length); return t; }); }
      function ocrOne(file){
        var plug=capPlugin("TicketOcr");
        if(!plug) return ocrClassic(file);
        return nativeImage(file).then(function(b64){ return plug.recognize({ image:b64 }); }).then(function(res){
          var t=mlkitRows(res||{}); diag.push("mlkit:"+((res&&res.lines)||[]).length+" morceaux");
          if(t && t.replace(/\s/g,"").length>=8) return t;
          throw new Error("lecture vide");
        }).catch(function(e){ diag.push("mlkit KO("+((e&&e.message)||e)+")"); return ocrClassic(file); });
      }
      function ocrClassic(file){
        return preprocess(file).then(function(src){
          if(!(src && src.toBlob)) diag.push("preproc-KO");
          if(store.read("ocrKey","")){
            return canvasToBlob(src).then(function(blob){
              var ko = (blob && blob.size) ? Math.round(blob.size/1024) : "?";
              return ocrCloud(blob).then(function(t){ diag.push("cloud "+ko+"Ko:"+(t||"").length+"car"); return t; });
            }).catch(function(e){ diag.push("cloud KO("+((e&&e.message)||e)+")"); return localOne(src); });
          }
          return localOne(src);
        });
      }
      var texts=[], idx=0;
      function step(){
        if(idx>=files.length){
          var p=parseTicket(texts.join("\n"));
          state.draft.montant = (p.total==="")?"":String(p.total).replace(".",",");
          state.draft.date = p.date || state.draft.date;
          state.draft.marchand = p.marchand || state.draft.marchand;
          state.draft.categorie = p.categorie;
          state.draft.articles = (p.lignes||[]).map(function(a){ return {label:a.label, prix:a.prix, produit:lookupAppris(a.label)}; });
          var hasData = state.draft.montant || (state.draft.articles && state.draft.articles.length);
          var eng = diag.some(function(d){ return /^mlkit:/.test(d); }) ? "sur le téléphone (ML Kit)" : (diag.some(function(d){ return /^cloud \d/.test(d); }) ? "par OCR.space" : "par Tesseract");
          var ko = diag.filter(function(d){ return /KO/.test(d); }).join(" · ");
          state.note = hasData ? ("Lu "+eng+(ko?" — "+ko:"")+" · vérifie les montants") : ("Lecture vide ["+diag.join(" · ")+"]. Réessaie avec une photo plus nette, ou recadrée sur le ticket.");
          state.busy=false; state.scanMsg=""; render(); return;
        }
        if(files.length>1){ var sm=document.getElementById("scanmsg"); if(sm) sm.textContent="Lecture "+(idx+1)+"/"+files.length+"…"; state.prog=0; var bar=document.getElementById("bar"); if(bar) bar.style.width="0%"; }
        ocrOne(files[idx]).then(function(t){ texts.push(t||""); idx++; step(); })
          .catch(function(e){ console.warn("OCR indisponible:", e); texts.push(""); idx++; step(); });

    };

    function fileToThumb(file, cb){

    // Projection d'une provision sur une suite de mois : solde de fin de mois, sorties (payées ou prévues), manque éventuel
    function provProj(p, months, curM){
      var res=[], prev=0, start=p.startMonth||curM;
      months.forEach(function(mk){
        var r={ bal:0, out:0, planned:0, est:false, short:0 };
        if(mk<start){ res.push(r); prev=0; return; }
        var rec=0; (p.prelevements||[]).forEach(function(pr){ if(pr.month===mk) rec+=Number(pr.montant)||0; });
        var bal;
        if(mk<=curM) bal=provState(p, mk).bal;
        else { bal=prev+(((p.skips||[]).indexOf(mk)<0)?mensuelAt(p, mk):0)-rec; if(bal<0){ r.short+=-bal; bal=0; } }
        r.out=rec;
        if(p.echeance && +mk.split("-")[1]===+p.echeance && !rec && mk>=curM){
          var amt=Number(p.prevu)||0; if(!amt){ amt=bal; r.est=true; }
          if(amt>bal){ r.short+=amt-bal; bal=0; } else bal-=amt;
          r.planned=amt; r.out+=amt;
        }
        r.bal=bal; prev=bal; res.push(r);
      });
      return res;
    }

      provisions.forEach(function(p){
        provProj(p, months, curM).forEach(function(r,i){
          var t=tot[i]; t.bal+=r.bal; t.out+=r.out; t.short+=r.short; t.planned+=r.planned;
          if(r.out>0) t.items.push({ nom:p.nom, amt:r.out, planned:r.planned>0, est:r.est, short:r.short, mk:months[i] });
        });
      });

    }

    function backupData(){

      var dump={ _app:"tickets", _version:1, _date:new Date().toISOString(), data:{} };
      keys.forEach(function(k){ var v=store.read(k, null); if(v!==null) dump.data[k]=v; });
      dump.photos = PHOTOS;

        if(fileObj && navigator.canShare && navigator.canShare({files:[fileObj]}) && !backupData._forceDl){

            {l:"Envoyer vers… (Drive, mail)", fn:function(){ navigator.share({ files:[fileObj], title:"Sauvegarde Tickets" }).then(function(){ store.write("lastBackup", new Date().toISOString()); uiToast("Sauvegarde envoyée ✓"); render(); }).catch(function(){}); }},
            {l:"Télécharger sur le téléphone", fn:function(){ backupData._forceDl=true; try{ backupData(); } finally { backupData._forceDl=false; } }}

    function restoreData(file){
      if(fyMember()){ uiToast("Tes données viennent du foyer : quitte le foyer avant de restaurer une sauvegarde"); return; }
      var r=new FileReader();
      r.onload=function(){
        try{
          var obj=JSON.parse(r.result);
          var data=(obj && obj.data && typeof obj.data==="object") ? obj.data : obj;
          if(!data || typeof data!=="object") throw new Error("format non reconnu");
          var n=(data.entries && data.entries.length) ? data.entries.length : 0;
          if(!window.confirm("Restaurer cette sauvegarde ?\n"+n+" ticket(s) vont REMPLACER les données actuelles.")) return;
          ["entries","cats","familles","produits","familleDe","appris","fraisCommuns","argentMois","liquideMois","budgets","bourseHist","virements","soldeInit","provisions","epargne","bourse","ocrKey","offlineReady","taxoV2","simThreshold","virEpV2","comptes","devise","personnes","cptChartDef","comChartDef","anChartDef","artChartDef","bView","bChartMode","cptRange","adRange","compteSel","communParts","homeScope","budgetsP"].forEach(function(k){
            if(k in data) store.write(k, data[k]);
          });
          if(!("comptes" in data)) store.write("comptes", null);
          if(!("communParts" in data)) store.write("communParts", null);   // ancienne sauvegarde : parts égales   // ancienne sauvegarde : le compte est reconstruit au redémarrage
          store.write("askName", false);
          if(data.taxoV2!==2) store.write("taxoV2", null);
          if(data.virEpV2!==1) store.write("virEpV2", null);
          var photos=(obj && obj.photos && typeof obj.photos==="object") ? obj.photos : null;
          function finishRestore(){ window.alert("Sauvegarde restaurée ✓"); window.location.reload(); }
          if(photos && IDB){ var ch=Promise.resolve(); Object.keys(photos).forEach(function(id){ ch=ch.then(function(){ return idbPut(id, photos[id]); }); }); ch.then(finishRestore).catch(finishRestore); }
          else { finishRestore(); }
        }catch(e){ window.alert("Fichier invalide : "+((e&&e.message)||e)); }
      };
      r.onerror=function(){ window.alert("Lecture du fichier impossible."); };

    document.addEventListener("visibilitychange", refreshOnReturn);
    window.addEventListener("pageshow", refreshOnReturn);
    window.addEventListener("focus", refreshOnReturn);
    document.addEventListener("click", function(e){
      var t=e.target;
      while(t && t.nodeType===1){
        if(t.id==="hmenu" || t.id==="bkstat"){ openMenu(); return; }
        t=t.parentNode;
      }
    });

    // ---------- Widgets Android (écran d'accueil) ----------
    // L'appli prépare un résumé de tes chiffres et le donne à Android, qui l'affiche dans les widgets.
    // Envoyé après chaque changement (regroupé sur 1,5 s) et quand on quitte l'appli. Version Store : réservé à Plus.
    function widgetSnapshot(){
      var m=monthKey(todayISO()), pm=prevMonthKey(m), me=mePerson(), mainK=myAcct().key;
      function r2(n){ return Math.round((Number(n)||0)*100)/100; }
      function fig(keys, mm){ var t=0; keys.forEach(function(k){ t+=computeCompteMonth(k, mm).solde; var q=liquideAt(k, mm); if(q) t+=q.val; }); return t; }
      var allK=comptes.map(function(a){ return a.key; }), sMe=fig([mainK], m), sAll=fig(allK, m);
      var _p=m.split("-"), dim=new Date(+_p[0], +_p[1], 0).getDate();
      var snap={ v:1, t:Date.now(), edition:EDITION, plus:canUse("widgets"), lock:!!lockCfg, sym:curSym(), multi:comptes.length>1,
        month:m, monthName:monthLabelOf(m).split(" ")[0], prevName:monthLabelOf(pm).split(" ")[0], dim:dim,
        solde:{ moi:{ v:r2(sMe), d:r2(sMe-fig([mainK], pm)), acct:myAcct().nom }, foyer:{ v:r2(sAll), d:r2(sAll-fig(allK, pm)), n:comptes.length } } };
      // Commun : ta part du mois et les frais communs pas encore payés
      try{ var CM=communModel(m), ci=(CM.D.byP.Commun?CM.D.byP.Commun.items:[]), todo=0, pc=CM.effPct(CM.me);
        ci.forEach(function(f){ if(!fraisDone(f, m)) todo++; });
        snap.commun={ part:r2(CM.partOf(CM.me)), pct:Math.round(pc*10)/10, todo:todo, n:ci.length, perso:r2(CM.persoOf(CM.me)), com:r2(CM.communShareOf(CM.me)), prod:r2(CM.D.prod*pc/100) }; }catch(e){}
      // Mois en cours : tickets du mois, budget, 3 plus grosses catégories
      var mois=state.entries.filter(function(e){ return monthKey(e.date)===m; }), spent=0, byCat={}, bud=0, day=new Date().getDate();
      mois.forEach(function(e){ var v=Number(e.montant)||0, c=e.categorie||"Autre"; spent+=v; byCat[c]=(byCat[c]||0)+v; });
      Object.keys(budgets).forEach(function(c){ if(budgets[c]>0) bud+=budgets[c]; });
      function cumOf(mm, upto){ var p2=mm.split("-"), nd=new Date(+p2[0], +p2[1], 0).getDate(), per=[], out=[], t=0, i;
        for(i=0;i<nd;i++) per.push(0);
        state.entries.forEach(function(e){ if(monthKey(e.date)!==mm) return; var dd=+String(e.date).slice(8,10); if(dd>=1 && dd<=nd) per[dd-1]+=Number(e.montant)||0; });
        for(i=0;i<Math.min(upto||nd, nd);i++){ t+=per[i]; out.push(r2(t)); } return out; }
      snap.mois={ spent:r2(spent), budget:r2(bud), perDay:r2(day?spent/day:0), n:mois.length, cum:cumOf(m, day), prevCum:cumOf(pm),
        cats:Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; }).slice(0,5).map(function(c){ return { n:c, v:r2(byCat[c]), c:catIcon(c).col }; }) };
      // Foyer : ce qu'il y a sur les comptes de chacun aujourd'hui (banque estimée)
      var own={}, order=[], tot=0, epT=0;
      comptes.forEach(function(a){ var o=acctOwner(a)||"Comptes partagés", v=0; try{ v=acctFigures(a.key, m).banque; }catch(e){} if(!(o in own)){ own[o]=0; order.push(o); } own[o]+=v; tot+=v; });
      order.sort(function(x,y){ if(x===me) return -1; if(y===me) return 1; return own[y]-own[x]; });
      epargne.forEach(function(c){ epT+=epAt(c, m); });
      var prT=0; try{ prT=provTotalAt(m); }catch(e){}
      snap.foyer={ total:r2(tot), accts:comptes.length, n:order.filter(function(o){ return o!=="Comptes partagés"; }).length, ep:r2(epT), prov:r2(prT),
        bo:r2((FEAT.bourse && bourse.length)?bourseTotalLive():0),
        ppl:order.map(function(o,i){ return { n:o, v:r2(own[o]), c:ACOLS[i%ACOLS.length] }; }),
        list:comptes.map(function(a){ var v=0; try{ v=acctFigures(a.key, m).banque; }catch(e){} return { n:a.nom, v:r2(v), c:acctCol(a) }; }) };
      // Bourse (appli perso) : le total et de quoi le recalculer sans ouvrir l'appli (positions, taux de change, relais des cours)
      if(FEAT.bourse && bourse.length){
        var fixed=0, items=[], ref=null, hist=[];
        bourse.forEach(function(c){ if(!bOpen(c)) return; var l=bLast(c);
          if(c.sol && c.solQty){ items.push({ s:"cg", r:"solana", q:Number(c.solQty)||0 }); fixed+=bCash(l); return; }
          if(c.positions && c.positions.length){ fixed+=bCash(l);
            c.positions.forEach(function(p){ if(p.src==="man") fixed+=Number(p.valeur)||0; else if(p.src==="cg"||p.src==="yf") items.push({ s:p.src, r:p.ref, q:Number(p.qte)||0 }); }); return; }
          fixed+=bTot(l); });
        var lim=Date.now()-86400000;
        if(bDay && bDay.pts && bDay.pts.length>1 && Date.now()-bDay.t<6*3600000){ bDay.pts.forEach(function(q){ if(q.t>=lim) hist.push([q.t, r2(q.v)]); }); }
        else bourseHist.forEach(function(h){ if(h.t<lim) ref=h.v; else hist.push([h.t, r2(h.v)]); });
        if(ref==null && hist.length) ref=hist[0][1];
        snap.bourse={ total:r2(bourseTotalLive()), ref:(ref!=null?r2(ref):null), hist:hist.slice(-160), fixed:r2(fixed), items:items, base:BASE, fx:(fxCache&&fxCache.rates)||{}, api:coursApi() };
      }
      return snap;
    }
    var wLast="", wTimer=0;
    // Appel sûr d'une fonction Android (ancienne appli installée : la fonction peut manquer)
    function npCall(name, arg){
      var NP=capPlugin("TicketsNative"); if(!NP || typeof NP[name]!=="function") return Promise.reject(new Error("indisponible"));
      try{ return Promise.resolve(NP[name](arg)); }catch(e){ return Promise.reject(e); }
    }
    function pushWidgets(now){
      if(!capNative()) return;
      clearTimeout(wTimer);
      wTimer=setTimeout(function(){
        try{ var j=JSON.stringify(widgetSnapshot()), cmp=j.replace(/"t":\d+,/,""); if(cmp===wLast) return; wLast=cmp;
          npCall("widgetData", { json:j }).catch(function(){ wLast=""; }); }catch(e){ try{ console.warn(e); }catch(_){} }
      }, now?0:1500);
    }
    // Un widget a été touché : l'appli s'ouvre sur l'onglet voulu (Scan : directement l'appareil photo)
    function widgetLaunch(){
      npCall("launchTarget").then(function(r){ var t=r && r.target; if(t) openFromWidget(t); }).catch(function(){});
    }
    function openFromWidget(t){
      if(document.getElementById("lockscreen")){ var n=0, iv=setInterval(function(){ if(!document.getElementById("lockscreen") || ++n>240){ clearInterval(iv); if(n<=240) openFromWidget(t); } }, 500); return; }
      if(t==="plus"){ uiChoice("Tickets Plus", "Les widgets font partie de Tickets Plus. L'achat de Plus arrivera bientôt dans l'appli.", [{ l:"D'accord", fn:function(){} }]); return; }
      if(t==="scan"){ state.view="list"; render(); widgetScan(); return; }
      if(t==="compte_foyer" || t==="foyer") state.compteSel=(comptes.length>1)?"__all":myAcct().key;
      else if(t==="compte") state.compteSel=myAcct().key;
      var map={ compte:"compte", compte_foyer:"compte", foyer:"compte", communes:"communes", mois:"list", bourse:(FEAT.bourse?"bourse":"list") };
      state.view=map[t]||"list"; render(); window.scrollTo(0,0);
    }
    function widgetScan(){
      if(fyRO()){ uiToast("Consultation : tu ne peux pas ajouter de ticket"); return; }
      var Cam=capPlugin("Camera"); if(!Cam || typeof Cam.getPhoto!=="function"){ openScanChooser(); return; }
      Cam.getPhoto({ quality:88, width:2400, resultType:"dataUrl", source:"CAMERA", correctOrientation:true, saveToGallery:false, allowEditing:false }).then(function(ph){
        var u=ph && ph.dataUrl; if(!u) return;
        var bin=atob(u.slice(u.indexOf(",")+1)), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        filein.onchange({ target:{ files:[new File([arr], "ticket.jpg", { type:"image/jpeg" })], value:"" } });
      }).catch(function(e){ if(!/cancel/i.test(String((e&&e.message)||e||""))) openScanChooser(); });
    }
    document.addEventListener("visibilitychange", function(){ if(document.hidden) pushWidgets(true); else setTimeout(widgetLaunch, 300); });
    setTimeout(function(){ widgetLaunch(); pushWidgets(true); }, 600);

    // Mise à jour automatique : au retour dans l'appli, recharge si une nouvelle version β est en ligne
    (function(){
      var cur=(document.querySelector('meta[name=build]')||{}).content||"", last=Date.now();
      function check(){
        if(document.visibilityState!=="visible" || Date.now()-last<60000) return;
        last=Date.now();
        fetch("./index.html?v="+Date.now(), { cache:"no-store" }).then(function(r){ return r.ok ? r.text() : ""; }).then(function(t){
          var m=t && t.match(/<meta name="build" content="([^"]*)"/);
          if(!m || !cur || m[1]===cur) return;
          var ae=document.activeElement, typing=ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
          if(state.view==="form" || state.busy || typing) return;   // ne jamais couper une saisie en cours
          location.reload();
        }).catch(function(){});
      }
      document.addEventListener("visibilitychange", check);
      window.addEventListener("focus", check);
      setTimeout(function(){ last=0; check(); }, 8000);   // aussi juste après l'ouverture (au cas où une ancienne version a été servie)
    })();
    if("serviceWorker" in navigator){
      window.addEventListener("load", function(){
        navigator.serviceWorker.register("../sw.js").then(function(reg){
          reg.update().catch(function(){});
        }).catch(function(){});
      });
      var swReloaded=false;
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if(swReloaded) return;
        swReloaded=true;
        window.location.reload();
      });
    }
  })();
  </script>
