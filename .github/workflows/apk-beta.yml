name: APK Android β

# Construit les deux applis Android de test à partir du même code (Capacitor) :
#   - Perso : tout, Bourse comprise (installée à la main) ;
#   - Store : la future version Play Store, sans Bourse.
# Les deux chargent la version β, lisent les tickets avec ML Kit et ont les widgets
# (dans la version Store, les widgets sont réservés à Tickets Plus ; pas de widget Bourse).
# Elles sont publiées dans la release « apk-beta ».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-android/**'
      - '.github/workflows/apk-beta.yml'

permissions:
  contents: write

concurrency:
  group: apk-beta
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release « apk-beta »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Applis Android de test de Tickets (version ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}).
          - Tickets-perso.apk : ta version, avec la Bourse.
          - Tickets-store.apk : la future version Play Store, sans Bourse."
          if gh release view apk-beta >/dev/null 2>&1; then
            gh release edit apk-beta --notes "$NOTES"
          else
            gh release create apk-beta --prerelease --title "Tickets β (Android)" --notes "$NOTES"
          fi
          gh release delete-asset apk-beta Tickets-beta.apk -y 2>/dev/null || true

  apk:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: perso
            app_id: fr.bpierrard.tickets.beta     # identifiant de l'appli déjà installée : mise à jour sans perte
            app_name: Tickets Perso
          - edition: store
            app_id: fr.bpierrard.tickets.store    # provisoire, en attendant le nom définitif
            app_name: Tickets Store
    defaults:
      run:
        working-directory: app-android
    env:
      EDITION: ${{ matrix.edition }}
      APP_ID: ${{ matrix.app_id }}
      APP_NAME: ${{ matrix.app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Réglages de l'édition
        run: |
          node -e '
            const fs=require("fs"), c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.appId=process.env.APP_ID; c.appName=process.env.APP_NAME;
            c.android=c.android||{}; c.android.appendUserAgent="TicketsApp/"+process.env.EDITION;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c,null,2));
            console.log(JSON.stringify(c,null,2));'

      - name: Dépendances Capacitor
        run: npm install --no-audit --no-fund

      - name: Projet Android
        run: |
          npx cap add android
          PKG_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$PKG_DIR"
          for f in native/*.java; do
            sed "s/^package .*;/package $APP_ID;/" "$f" > "$PKG_DIR/$(basename "$f")"
          done
          # Widgets de l'écran d'accueil : écrans, icônes, tailles, et le widget Bourse seulement dans l'appli perso
          cp -r native/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'tk_*.xml' -exec sed -i "s/__PKG__/$APP_ID/g" {} +
          BOURSE=false; [ "$EDITION" = perso ] && BOURSE=true
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <bool name="tk_bourse">%s</bool>\n</resources>\n' "$BOURSE" > android/app/src/main/res/values/tk_edition.xml
          node native/patch-manifest.js android/app/src/main/AndroidManifest.xml
          cp native/tickets.gradle android/app/
          printf "\napply from: 'tickets.gradle'\n" >> android/app/build.gradle
          chmod +x android/gradlew
          npx cap sync android

      - name: Icône et écran de démarrage
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --assetPath assets

      - name: Compilation
        working-directory: app-android/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Tickets-$EDITION.apk"
          ls -la "Tickets-$EDITION.apk"
          gh release upload apk-beta "Tickets-$EDITION.apk" --clobber
