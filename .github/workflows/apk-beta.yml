name: APK Android β

# Construit les deux applis Android de test à partir du même code (Capacitor) :
#   - Perso : tout, Bourse comprise (installée à la main). Elle charge la version β en ligne
#     (chaque correction arrive tout de suite) et garde une copie de la page pour marcher sans réseau ;
#   - Store : la future version Play Store, sans Bourse. L'appli entière est dans l'APK (β, lecteur PDF,
#     inflation INSEE du moment) : aucune connexion pour l'usage normal, mises à jour par le Store.
# Les deux lisent les tickets avec ML Kit et ont les widgets
# (dans la version Store, les widgets sont réservés à Tickets Plus ; pas de widget Bourse).
# Elles sont publiées dans la release « apk-beta ».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-android/**'
      - 'beta/**'
      - '.github/workflows/apk-beta.yml'

permissions:
  contents: write

concurrency:
  group: apk-beta
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release « apk-beta »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Applis Android de test de Tickets (version ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}).
          - Tickets-perso.apk : ta version, avec la Bourse ; chargée en ligne, copie gardée pour marcher sans réseau.
          - Tickets-store.apk : la future version Play Store, sans Bourse ; l'appli entière est dans l'APK."
          if gh release view apk-beta >/dev/null 2>&1; then
            gh release edit apk-beta --notes "$NOTES"
          else
            gh release create apk-beta --prerelease --title "Tickets β (Android)" --notes "$NOTES"
          fi
          gh release delete-asset apk-beta Tickets-beta.apk -y 2>/dev/null || true

  apk:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: perso
            app_id: fr.bpierrard.tickets.beta     # identifiant de l'appli déjà installée : mise à jour sans perte
            app_name: Tickets Perso
          - edition: store
            app_id: fr.bpierrard.tickets.store    # provisoire, en attendant le nom définitif
            app_name: Tickets Store
    defaults:
      run:
        working-directory: app-android
    env:
      EDITION: ${{ matrix.edition }}
      APP_ID: ${{ matrix.app_id }}
      APP_NAME: ${{ matrix.app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Réglages de l'édition
        run: |
          node -e '
            const fs=require("fs"), c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.appId=process.env.APP_ID; c.appName=process.env.APP_NAME;
            c.android=c.android||{}; c.android.appendUserAgent="TicketsApp/"+process.env.EDITION;
            if(process.env.EDITION==="store"){ c.server={ androidScheme:"https" }; }   // appli dans l APK : rien en ligne
            else { c.android.appendUserAgent+=" TkOff/1"; }   // Perso : copie hors ligne gérée par l appli (pas de service worker)
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c,null,2));
            console.log(JSON.stringify(c,null,2));'

      - name: Dépendances Capacitor
        run: npm install --no-audit --no-fund

      - name: Appli dans l'APK (Store)
        if: matrix.edition == 'store'
        run: |
          rm -rf www && mkdir -p www/pdfjs
          cp -r ../beta/. www/
          # lecteur de PDF des factures, même version que dans la β
          V=$(grep -oP 'PDFJS_V="\K[0-9.]+' www/index.html)
          npm pack "pdfjs-dist@$V" --silent
          tar xzf "pdfjs-dist-$V.tgz"
          cp package/legacy/build/pdf.min.mjs package/legacy/build/pdf.worker.min.mjs www/pdfjs/
          rm -rf package "pdfjs-dist-$V.tgz"
          # inflation INSEE du moment (Analyse avancée), prise au relais à la compilation
          API=$(grep -oP 'COURS_API *= *"\K[^"]+' www/index.html | head -1)
          curl -fsS --max-time 20 "$API/inflation" -o www/insee.json || echo '{}' > www/insee.json
          node -e 'const j=JSON.parse(require("fs").readFileSync("www/insee.json","utf8")); console.log("INSEE :", j.ok?(j.yoy+" % ("+j.last+")"):"absent")' || echo '{}' > www/insee.json
          ls -la www www/pdfjs

      - name: Projet Android
        run: |
          npx cap add android
          PKG_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$PKG_DIR"
          for f in native/*.java; do
            sed "s/^package .*;/package $APP_ID;/" "$f" > "$PKG_DIR/$(basename "$f")"
          done
          # Widgets de l'écran d'accueil : écrans, icônes, tailles, et le widget Bourse seulement dans l'appli perso
          cp -r native/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'tk_*.xml' -exec sed -i "s/__PKG__/$APP_ID/g" {} +
          BOURSE=false; [ "$EDITION" = perso ] && BOURSE=true
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <bool name="tk_bourse">%s</bool>\n</resources>\n' "$BOURSE" > android/app/src/main/res/values/tk_edition.xml
          node native/patch-manifest.js android/app/src/main/AndroidManifest.xml
          cp native/tickets.gradle android/app/
          printf "\napply from: 'tickets.gradle'\n" >> android/app/build.gradle
          chmod +x android/gradlew
          npx cap sync android

      - name: Icône et écran de démarrage
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --assetPath assets

      - name: Compilation
        working-directory: app-android/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Tickets-$EDITION.apk"
          ls -la "Tickets-$EDITION.apk"
          gh release upload apk-beta "Tickets-$EDITION.apk" --clobber
