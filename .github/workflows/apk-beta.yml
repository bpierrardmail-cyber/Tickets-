name: APK Android β

# Construit l'appli Android de test (Capacitor) qui charge la version β
# et lit les tickets avec ML Kit, puis la publie dans la release « apk-beta ».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-android/**'
      - '.github/workflows/apk-beta.yml'

permissions:
  contents: write

concurrency:
  group: apk-beta
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dépendances Capacitor
        run: npm install --no-audit --no-fund

      - name: Projet Android
        run: |
          npx cap add android
          PKG_DIR=android/app/src/main/java/fr/bpierrard/tickets/beta
          mkdir -p "$PKG_DIR"
          cp native/MainActivity.java native/TicketOcrPlugin.java "$PKG_DIR/"
          cp native/tickets.gradle android/app/
          printf "\napply from: 'tickets.gradle'\n" >> android/app/build.gradle
          chmod +x android/gradlew
          npx cap sync android

      - name: Icône et écran de démarrage
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --assetPath assets

      - name: Compilation
        working-directory: app-android/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Tickets-beta.apk
          ls -la Tickets-beta.apk
          NOTES="Appli Android de test de Tickets. Elle charge la version β et lit les tickets avec ML Kit, sur le téléphone. Version ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}."
          if gh release view apk-beta >/dev/null 2>&1; then
            gh release edit apk-beta --notes "$NOTES"
          else
            gh release create apk-beta --prerelease --title "Tickets β (Android)" --notes "$NOTES"
          fi
          gh release upload apk-beta Tickets-beta.apk --clobber
