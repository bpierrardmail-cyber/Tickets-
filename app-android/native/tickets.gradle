// Réglages propres à Tickets β, ajoutés au projet Android généré par Capacitor.
def runNum = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer
// Clé de signature (07/11) : la vraie est dans les secrets GitHub (TK_KEYSTORE_B64, TK_KEYSTORE_PASS), écrite par le workflow
// dans TK_KS_FILE ; sans eux, l'ancienne clé de test (publique, à retirer dès que les secrets sont en place).
def ksEnv = System.getenv("TK_KS_FILE")
def ks = ksEnv ? file(ksEnv) : file("../../beta-test.keystore")
def ksPass = ksEnv ? System.getenv("TK_KS_PASS") : "tickets-beta-test"
def ksAlias = ksEnv ? (System.getenv("TK_KS_ALIAS") ?: "tickets") : "tickets-beta"

android {
    defaultConfig {
        versionCode runNum
        versionName "beta-" + runNum
        // Téléphones récents uniquement (ARM 64 bits) : APK deux fois plus léger
        ndk { abiFilters 'arm64-v8a' }
    }
    if (ks.exists()) {
        signingConfigs {
            betatest {
                storeFile ks
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
            }
        }
        buildTypes {
            release { signingConfig signingConfigs.betatest }
        }
    }
}

dependencies {
    // Lecture de texte ML Kit, modèle latin intégré à l'appli (fonctionne hors ligne)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Copie hors ligne de l'appli Perso : savoir si le WebView ajoute lui-même le pont Capacitor
    implementation "androidx.webkit:webkit:${rootProject.ext.has('androidxWebkitVersion') ? rootProject.ext.androidxWebkitVersion : '1.12.1'}"
    // Empreinte digitale (BiometricPrompt)
    implementation 'androidx.biometric:biometric:1.1.0'
    // Widgets : mise à jour de la Bourse en arrière-plan (toutes les 15 minutes)
    implementation 'androidx.work:work-runtime:2.9.1'
    // Foyer partagé : lecture du QR code d'invitation (lecteur de Google Play, sans permission caméra)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // Photo d'un ticket ou d'une facture : scanner de documents de Google Play (recadre, redresse, contraste ; sans permission caméra)
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    // Sauvegarde sur Google Drive : connexion Google et accès « drive.file » (AuthorizationClient)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
